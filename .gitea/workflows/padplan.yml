name: padplan
on:
  push:
    branches: [main]

jobs:
  ship:
    runs-on: boat
    steps:
      - uses: actions/checkout@v4
      - name: Check (typecheck, lint, format, tests)
        run: docker build --platform linux/amd64 --target check --progress plain --build-arg "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}" --build-arg "MOON_BUILTIN_REGISTRY_HOST=${MOON_BUILTIN_REGISTRY_HOST:-}" -f apps/padplan/Dockerfile .
      - name: Publish
        env:
          IMAGE: ${{ vars.IMAGE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./scripts/ci/publish
      - name: Deploy through homelab
        env:
          STACK: padplan
          IMAGE: ${{ vars.IMAGE }}
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REVISION: ${{ github.sha }}
        run: ./scripts/ci/reconcile
